# Docker Cloud Build Configuration
# This file configures automated builds on Docker Cloud

# Build hooks - Docker Cloud will call these during build process
build:
  # Main build configuration
  dockerfile: Dockerfile.prod
  context: ./
  # Labels for image tagging
  labels:
    - "com.example.version=1.0"
    - "com.example.release-date=2024"

# Build Args - passed during docker build
args:
  BUILD_DATE: "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  VCS_REF: "$(git rev-parse --short HEAD)"
  VERSION: "1.0.0"

# Cache settings for faster builds
cache: true

# Notification webhooks (optional - for CI/CD integration)
# webhooks:
#   - url: "https://hooks.example.com/docker-build"
#     events: ["build_success", "build_failure"]
