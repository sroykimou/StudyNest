<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | StudyNest</title>
    <meta name="description" content="ចូលប្រើប្រាស់គណនី StudyNest — វេទិកាសិក្សាសម្រាប់សិស្សានុសិស្សថ្នាក់ទី១២">
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Rajdhani:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      /* ── Styles រក្សាទុកដដែល ព្រោះវាស្អាតហើយ ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --primary: #4f46e5;
        --primary-glow: rgba(79, 70, 229, 0.45);
        --accent: #74ebd5;
        --glass-bg: rgba(255, 255, 255, 0.1);
        --glass-border: rgba(255, 255, 255, 0.22);
        --input-bg: rgba(255, 255, 255, 0.08);
        --text-primary: #f0f4ff;
        --text-muted: rgba(210, 220, 255, 0.65);
      }

      body {
        font-family: "Kantumruy Pro", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          #1e1b4b 0%,
          #0f172a 50%,
          #134e4a 100%
        );
        color: var(--text-primary);
        overflow: hidden;
      }

      .card {
        width: 380px;
        padding: 40px;
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .logo-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        margin: 0 auto 20px;
        box-shadow: 0 0 20px var(--primary-glow);
      }
      .brand {
        font-family: "Rajdhani", sans-serif;
        font-size: 26px;
        margin-bottom: 30px;
      }

      .input-group {
        text-align: left;
        margin-bottom: 20px;
      }
      .input-group label {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap input {
        width: 100%;
        padding: 12px 15px 12px 40px;
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: #fff;
        outline: none;
      }
      .input-wrap input:focus {
        border-color: var(--accent);
      }
      .input-wrap i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
      }
      .login-btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }
      .login-btn.loading {
        opacity: 0.6;
        pointer-events: none;
      }

      .footer-links {
        margin-top: 25px;
        font-size: 13px;
        color: var(--text-muted);
      }
      .footer-links a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
        z-index: 1000;
      }
      .toast.show {
        display: block;
        animation: fadeInUp 0.3s;
      }
      .toast.error {
        background: #ef4444;
        color: #fff;
      }
      .toast.success {
        background: #10b981;
        color: #fff;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translate(-50%, 20px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-icon"><i class="fas fa-rocket"></i></div>
      <h1 class="brand">StudyNest</h1>

      <form id="loginForm">
        <div class="input-group">
          <label>ឈ្មោះអ្នកប្រើប្រាស់</label>
          <div class="input-wrap">
            <i class="fas fa-user"></i>
            <input
              type="text"
              id="username"
              placeholder="បញ្ចូលឈ្មោះ..."
              required
            />
          </div>
        </div>

        <div class="input-group">
          <label>លេខសម្ងាត់</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          ចូលប្រើប្រាស់
        </button>
      </form>

      <div class="footer-links">
        មិនទាន់មានគណនី? <a href="register.html">បង្កើតគណនីថ្មី</a>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const toast = document.getElementById("toast");

      function showToast(msg, type) {
        toast.textContent = msg;
        toast.className = `toast show ${type}`;
        setTimeout(() => {
          toast.className = "toast";
        }, 3000);
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");

        btn.classList.add("loading");
        btn.textContent = "កំពុងផ្ទៀងផ្ទាត់...";

        setTimeout(async () => {
          // ── SPECIAL ADMIN CHECK (hashed — do not store plain password here) ──
          async function tryAdminLogin(u, p) {
            const encoder = new TextEncoder();
            const data = encoder.encode(p);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
            // SHA-256 of the admin password
            const ADMIN_HASH = "23c1a538db5b9fe80121f748954f875d5ea1b1314af33864a26aefe3e1775d20";
            if (u === "sroy kimou" && hashHex === ADMIN_HASH) {
              showToast("Admin Login Successful!", "success");
              localStorage.setItem("currentUserName", u);
              localStorage.setItem("isAdmin", "true");
              setTimeout(() => { window.location.href = "../grade12/admin_panel.html"; }, 1000);
              return true;
            }
            return false;
          }

          // ── ឆែក Admin ជាមុន ──
          const wasAdmin = await tryAdminLogin(user, pass);
          if (wasAdmin) return;

          // ── ទាញទិន្នន័យពី localStorage មកឆែក ──
          const storedData = localStorage.getItem("user_" + user);

          if (!storedData) {
            showToast("រកមិនឃើញគណនីនេះទេ!", "error");
            btn.classList.remove("loading");
            btn.textContent = "ចូលប្រើប្រាស់";
            return;
          }

          const userData = JSON.parse(storedData);

          if (userData.password === pass) {
            showToast("ចូលប្រើប្រាស់ជោគជ័យ!", "success");

            // 1. រក្សាទុកឈ្មោះ User បច្ចុប្បន្ន
            localStorage.setItem("currentUserName", user);

            // 2. បង្កើត Level ឱ្យ User បើមិនទាន់មាន (Default = 0)
            if (!localStorage.getItem("userLevel_" + user)) {
              localStorage.setItem("userLevel_" + user, "0");
            }

            // 3. បញ្ជូនទៅកាន់ Dashboard តាម Grade និង Branch
            setTimeout(() => {
              const branch = userData.branch || "science";
              window.location.href = `../grade${userData.grade}/${branch}/${branch}_home.html`;
            }, 1000);
          } else {
            showToast("លេខសម្ងាត់មិនត្រឹមត្រូវ!", "error");
            btn.classList.remove("loading");
            btn.textContent = "ចូលប្រើប្រាស់";
          }
        }, 1200);
      });
    </script>
  </body>
</html>
