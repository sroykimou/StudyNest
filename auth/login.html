<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyNest</title>
    <meta name="description" content="ចូលប្រើប្រាស់គណនី StudyNest — វេទិកាសិក្សាសម្រាប់សិស្សានុសិស្សថ្នាក់ទី១២">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="../assets/style.css">
    <style>
        /* Specific overrides for login card if needed */
        .card {
            width: 100%;
            max-width: 380px;
            padding: 40px;
        }
        .login-btn {
            /* Inherit from sn-btn but can add more if needed */
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="drops" id="drops"></div>
    <div class="particles" id="particles"></div>

    <main class="card anim">
        <div class="logo-wrap anim-1">
            <div class="logo-icon">
                <i class="fas fa-rocket"></i>
            </div>
        </div>

        <h1 class="brand anim-2">StudyNest</h1>
        <p class="tagline anim-3">ចូលប្រើប្រាស់គណនីរបស់អ្នក</p>

        <form id="loginForm">
            <div class="input-group anim-4">
                <label for="username">ឈ្មោះអ្នកប្រើប្រាស់</label>
                <div class="input-wrap">
                    <i class="fas fa-user icon"></i>
                    <input type="text" id="username" placeholder="បញ្ចូលឈ្មោះ..." required autocomplete="username">
                </div>
            </div>

            <div class="input-group anim-5">
                <label for="password">លេខសម្ងាត់</label>
                <div class="input-wrap">
                    <i class="fas fa-lock icon"></i>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <i class="far fa-eye eye-toggle" id="togglePassword"></i>
                </div>
            </div>

            <div class="forgot anim-6">
                <a href="#">ភ្លេចលេខសម្ងាត់?</a>
            </div>

            <button type="submit" class="sn-btn anim-7" id="loginBtn">
                <span class="btn-text">ចូលប្រើប្រាស់</span>
                <div class="btn-spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
            </button>
        </form>

        <div class="footer-links anim-8">
            មិនទាន់មានគណនី? <a href="register.html">បង្កើតគណនីថ្មី</a>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="../assets/main.js"></script>
    <script>
        // Initialize background animations
        StudyNest.initBackground();

        // Toggle Password Visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        const loginForm = document.getElementById("loginForm");
        const toast = document.getElementById("toast");

        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.className = "toast";
            }, 3000);
        }

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            const btn = document.getElementById("loginBtn");

            btn.classList.add("loading");

            setTimeout(async () => {
                // Utility for hashing
                async function hashPass(p) {
                    const encoder = new TextEncoder();
                    const data = encoder.encode(p);
                    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
                }

                // Admin login check
                async function tryAdminLogin(u, p) {
                    try {
                        const hashHex = await hashPass(p);
                        const ADMIN_HASH = "23c1a538db5b9fe80121f748954f875d5ea1b1314af33864a26aefe3e1775d20";
                        if (u === "sroykimou" && hashHex === ADMIN_HASH) {
                            showToast("Admin Login Successful!", "success");
                            localStorage.setItem("currentUserName", u);
                            localStorage.setItem("isAdmin", "true");
                            setTimeout(() => { window.location.href = "../grade12/admin_panel.html"; }, 1000);
                            return true;
                        }
                    } catch (err) {
                        console.warn("Admin login check skipped (crypto API not available or error):", err);
                    }
                    return false;
                }

                const wasAdmin = await tryAdminLogin(user, pass);
                if (wasAdmin) return;

                const storedData = localStorage.getItem("user_" + user);

                if (!storedData) {
                    showToast("រកមិនឃើញគណនីនេះទេ!", "error");
                    btn.classList.remove("loading");
                    return;
                }

                const userData = JSON.parse(storedData);
                const hashedInput = await hashPass(pass);

                if (userData.password === hashedInput || userData.password === pass) {
                    // Fallback for old plaintext passwords (userData.password === pass)
                    // We should ideally re-hash and save if it was plaintext
                    if (userData.password === pass) {
                        userData.password = hashedInput;
                        localStorage.setItem("user_" + user, JSON.stringify(userData));
                    }

                    showToast("ចូលប្រើប្រាស់ជោគជ័យ!", "success");
                    localStorage.setItem("currentUserName", user);
                    if (!localStorage.getItem("userLevel_" + user)) {
                        localStorage.setItem("userLevel_" + user, "0");
                    }

                    setTimeout(() => {
                        const branch = userData.branch || "science";
                        const grade = userData.grade || "12";
                        window.location.href = `../grade${grade}/${branch}/${branch}_home.html`;
                    }, 1000);
                } else {
                    showToast("លេខសម្ងាត់មិនត្រឹមត្រូវ!", "error");
                    btn.classList.remove("loading");
                }
            }, 1200);
        });
    </script>
</body>
</html>
