version: '3.8'

# This configuration is for Docker Cloud automated builds
# It includes build args and caching strategies

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: yuhaii15/studynest_linux-amd64:${VERSION:-latest}
    container_name: studynest-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:7B6jGjL9T8R3uX4kZ9mP8W2qV7nB5zC1xY8wQ2tJ4sK=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=studynest
      - DB_USERNAME=studynest_user
      - DB_PASSWORD=studynest_password
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "8000:80"
    depends_on:
      - db
    networks:
      - studynest

  db:
    image: mysql:8.0
    container_name: studynest-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: studynest
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: studynest_user
      MYSQL_PASSWORD: studynest_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - studynest
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

networks:
  studynest:
    driver: bridge

volumes:
  db_data:
    driver: local
