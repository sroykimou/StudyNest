<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>លំហាត់គីមីវិទ្យា ថ្នាក់ទី១២ | StudyNest</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Project Styles -->
    <link rel="stylesheet" href="../../../../assets/style.css">
    
    <style>
        :root {
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
        }

        body {
            overflow-y: auto;
            display: block;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        .header-card {
            text-align: center;
            padding: 40px;
            margin-bottom: 30px;
        }

        .chapter-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            margin: 40px 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .lesson-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
        }

        .lesson-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px var(--accent-glow);
            background: rgba(255, 255, 255, 0.12);
        }

        .lesson-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent);
            transition: 0.3s;
        }

        .lesson-card:hover .icon-box {
            background: var(--accent);
            color: #0f172a;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .lesson-text h3 {
            color: white;
            margin-bottom: 6px;
            font-size: 17px;
        }

        .lesson-text p {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 500px;
            line-height: 1.5;
        }

        .start-btn {
            background: var(--accent);
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.3s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .back-btn-fixed {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
        }

        .back-btn-fixed a {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            color: white;
            padding: 10px 18px;
            border-radius: 14px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn-fixed a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-4px);
        }

        @media (max-width: 768px) {
            .lesson-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .start-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="drops" id="drops"></div>
    <div class="particles" id="particles"></div>

    <div class="back-btn-fixed anim">
        <a href="../../science_home.html">
            <i class="fas fa-arrow-left"></i> ត្រឡប់ក្រោយ
        </a>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="card header-card anim">
            <div class="logo-wrap">
                <div class="logo-icon"><i class="fas fa-flask"></i></div>
            </div>
            <h1 class="brand">លំហាត់គីមីវិទ្យា</h1>
            <p class="tagline">ជ្រើសរើសមេរៀនដើម្បីអនុវត្តលំហាត់</p>
        </div>

        <div class="chapter-title anim-3">
            <i class="fas fa-vial"></i> ជំពូកទី ១៖ ស៊ីនេទិចគីមី
        </div>

        <a href="../lesson/chapter1/chemical_kinetics.html" class="lesson-card anim-4">
            <div class="lesson-info">
                <div class="icon-box"><i class="fas fa-calculator"></i></div>
                <div class="lesson-text">
                    <h3>លំហាត់ល្បឿនប្រតិកម្ម</h3>
                    <p>លំហាត់គណនាល្បឿនមធ្យម និងល្បឿនខណៈនៃប្រតិកម្មគីមី។</p>
                </div>
            </div>
            <div class="start-btn">ចាប់ផ្តើម</div>
        </a>

        <div class="chapter-title anim-5" style="margin-top: 40px">
            <i class="fas fa-hourglass-start"></i> មេរៀនបន្ទាប់
        </div>

        <div class="lesson-card anim-6" style="opacity: 0.7; cursor: default;">
            <div class="lesson-info">
                <div class="icon-box"><i class="fas fa-lock"></i></div>
                <div class="lesson-text">
                    <h3>លំហាត់លំនឹងគីមី</h3>
                    <p>មាតិកានឹងមកដល់ឆាប់ៗនេះ...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../../assets/main.js"></script>
    <script>
        StudyNest.initBackground();
    </script>
</body>
</html>
