<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Center | StudyNest</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Rajdhani:wght@700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/style.css" />
    <style>
      body {
        background:
          radial-gradient(ellipse at 25% 35%, #312e81 0%, transparent 55%),
          radial-gradient(ellipse at 75% 65%, #0f766e 0%, transparent 55%),
          linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #134e4a 100%);
        color: white;
        font-family: "Kantumruy Pro", sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .pay-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(15px);
        width: 90%;
        max-width: 420px;
        padding: 40px;
        border-radius: var(--radius-card);
        text-align: center;
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 10;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .plan-info {
        background: rgba(79, 70, 229, 0.15);
        padding: 20px;
        border-radius: 20px;
        margin-bottom: 25px;
        border: 1px solid rgba(79, 70, 229, 0.3);
      }

      .plan-info h2 {
        margin: 0;
        font-size: 14px;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .plan-info .price {
        font-family: "Rajdhani";
        font-size: 48px;
        font-weight: 700;
        color: white;
        margin-top: 5px;
      }

      .qr-container {
        width: 100%;
        max-width: 260px;
        background: white;
        margin: 0 auto 25px;
        padding: 15px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }

      .qr-container:hover {
        transform: scale(1.02);
      }

      .qr-container img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
      }

      .instruction {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 30px;
        line-height: 1.6;
        padding: 0 10px;
      }
      .instruction b {
        color: white;
      }

      .btn-confirm {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #10b981, #059669);
        border: none;
        border-radius: var(--radius-btn);
        color: white;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition: 0.3s;
        text-decoration: none;
        font-size: 16px;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      }

      .btn-confirm:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
      }

      /* Unlock Code Section */
      .unlock-section {
        margin-top: 30px;
        padding-top: 25px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .unlock-section h3 {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .code-input-group {
        display: flex;
        gap: 10px;
      }
      .code-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 12px 15px;
        border-radius: 12px;
        color: white;
        font-family: "Rajdhani";
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        letter-spacing: 2px;
        outline: none;
        transition: 0.3s;
      }
      .code-input:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.1);
      }
      .btn-unlock {
        padding: 0 20px;
        background: var(--accent);
        border: none;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }
      .btn-unlock:hover {
        background: #2563eb;
      }

      .back-link {
        display: inline-block;
        margin-top: 25px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        transition: 0.3s;
        cursor: pointer;
      }
      .back-link:hover {
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Background animations from style.css will be inherited or can be added here -->
    <div class="drops">
      <div
        class="drop"
        style="left: 10%; width: 20px; height: 20px; animation-duration: 5s"
      ></div>
      <div
        class="drop"
        style="left: 80%; width: 15px; height: 15px; animation-duration: 7s"
      ></div>
    </div>

    <div class="pay-card">
      <div class="plan-info">
        <h2 id="planName">គម្រោងសិក្សា</h2>
        <div class="price" id="planPrice">$0.00</div>
      </div>

      <div class="qr-container">
        <img src="" id="qrImage" alt="ABA KHQR" />
      </div>

      <p class="instruction">
        សូមរក្សារូបភាព <b>ABA KHQR</b> នេះ រួចចូលទៅកាន់កម្មវិធី
        <b>ABA Mobile</b> ដើម្បីស្កេនបង់ប្រាក់។ បន្ទាប់ពីបង់រួច
        សូមចុចប៊ូតុងខាងក្រោមដើម្បីផ្ញើវិក្កយបត្រ។
      </p>

      <a href="https://t.me/kimou_15" target="_blank" class="btn-confirm">
        <i class="fab fa-telegram-plane"></i> ផ្ញើវិក្កយបត្រទៅតេឡេក្រាម
      </a>

      <!-- Unlock Code Section -->
      <div class="unlock-section">
        <h3>បើកគម្រោងដោយប្រើលេខកូដ</h3>
        <div class="code-input-group">
          <input type="text" id="unlockCode" class="code-input" placeholder="កូដសម្ងាត់" maxlength="10">
          <button onclick="verifyUnlockCode()" class="btn-unlock">
            <i class="fas fa-key"></i>
          </button>
        </div>
        <p id="unlockMsg" style="font-size: 12px; margin-top: 10px; min-height: 15px;"></p>
      </div>

      <div onclick="goBack()" class="back-link">
        <i class="fas fa-arrow-left"></i> ត្រឡប់ទៅទំព័រដើមវិញ
      </div>
    </div>

    <script>
      const currentUser = localStorage.getItem("currentUserName");
      if (!currentUser) {
        window.location.href = "../auth/login.html";
      }

      // --- ADMIN CONFIGURATION: YOUR HANDMADE SECRET ---
      // Keep this 2 or 3 digits to keep the code short!
      const MY_SHORT_SECRET = "77"; 
      // --------------------------------------------------

      function verifyUnlockCode() {
        const input = document.getElementById("unlockCode").value.trim().toUpperCase();
        const msg = document.getElementById("unlockMsg");
        
        if (!input) {
          msg.textContent = "សូមបញ្ចូលលេខកូដ!";
          msg.style.color = "#fbbf24";
          return;
        }

        // --- NEW SHORT RULE ---
        // Format: [First 3 Letters of Name] + [Level] + [Secret]
        // Example: DAR677
        
        const user = currentUser.toUpperCase().replace(/\s/g, ""); // "Sroy Kimou" -> "SROYKIMOU"
        const namePart = user.substring(0, 3); // "SRO"
        
        let detectedLevel = 0;
        if (input === namePart + "6" + MY_SHORT_SECRET) {
          detectedLevel = 6;
        } else if (input === namePart + "3" + MY_SHORT_SECRET) {
          detectedLevel = 3;
        }

        if (detectedLevel > 0) {
          const expiryTime = Date.now() + (30 * 24 * 60 * 60 * 1000);
          localStorage.setItem("userLevel_" + currentUser, detectedLevel);
          localStorage.setItem("userLevelExpiry_" + currentUser, expiryTime);

          msg.textContent = "ជោគជ័យ! បើកគម្រោង ៣០ ថ្ងៃ...";
          msg.style.color = "#10b981";
          
          setTimeout(() => {
            goBack();
          }, 1500);
        } else {
          msg.textContent = "លេខកូដមិនត្រឹមត្រូវ! (ប្រហែលខុសឈ្មោះ ឬកូដសម្ងាត់)";
          msg.style.color = "#ef4444";
        }
      }

      function goBack() {
        const userData = JSON.parse(localStorage.getItem("user_" + currentUser) || "{}");
        const branch = userData.branch || "science";
        window.location.href = `${branch}/${branch}_home.html`;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const reqLevel = urlParams.get("p");

      const planNameElem = document.getElementById("planName");
      const planPriceElem = document.getElementById("planPrice");
      const qrImageElem = document.getElementById("qrImage");

      if (reqLevel === "3") {
        planNameElem.textContent = "គម្រោងលំហាត់ (Standard)";
        planPriceElem.textContent = "$3.00";
        qrImageElem.src = "../assets/images/qr_3usd.jpg";
      } else if (reqLevel === "6") {
        planNameElem.textContent = "គម្រោង PRO AI (Premium)";
        planPriceElem.textContent = "$6.00";
        qrImageElem.src = "../assets/images/qr_6usd.jpg";
      } else {
        goBack();
      }
    </script>
  </body>
</html>
