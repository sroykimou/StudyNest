<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | StudyNest</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="../assets/style.css">
    <style>
        .admin-card {
            width: 100%;
            max-width: 460px;
            padding: 45px;
            border-radius: 32px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logout-pill {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ff5f5f;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        .logout-pill:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(1.05);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap .icon {
            position: absolute;
            left: 18px;
            color: var(--accent);
            font-size: 18px;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrap input, .input-wrap select {
            width: 100%;
            padding: 14px 18px 14px 50px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
            appearance: none;
        }

        .select-arrow {
            position: absolute;
            right: 18px;
            color: var(--text-muted);
            pointer-events: none;
            font-size: 12px;
        }

        .input-wrap input:focus, .input-wrap select:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px var(--accent-glow);
            outline: none;
        }

        .sn-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 18px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px var(--accent-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .sn-btn:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.2);
        }

        .result-box {
            margin-top: 40px;
            padding: 30px;
            background: rgba(139, 92, 246, 0.05);
            border-radius: 24px;
            text-align: center;
            border: 2px dashed var(--primary-glow);
            transition: all 0.4s;
        }

        #generatedCode {
            font-family: 'Rajdhani';
            font-size: 32px;
            color: var(--accent);
            letter-spacing: 4px;
            display: block;
            margin: 12px 0;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .copy-hint {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        #loginBox {
            text-align: center;
        }

        #loginBox .logo-icon {
            margin-bottom: 24px;
        }

        #loginBox h1 {
            font-size: 28px;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="drops" id="drops"></div>
    <div class="particles" id="particles"></div>

    <main class="card admin-card anim" id="loginBox">
        <div class="logo-wrap anim-1">
            <div class="logo-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
        </div>
        <h1 class="brand anim-2">ADMIN LOGIN</h1>
        
        <div class="input-group anim-3">
            <label for="adminPass">Password</label>
            <div class="input-wrap">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="adminPass" placeholder="Enter Admin Password">
            </div>
        </div>
        
        <button onclick="checkPass()" class="sn-btn anim-4">
            <span class="btn-text">LOGIN</span>
        </button>
    </main>

    <main class="card admin-card anim" id="mainPanel" style="display: none;">
        <div class="admin-header anim-1">
            <h1>HANDMADE CODES</h1>
            <div onclick="adminLogout()" class="logout-pill">ចាកចេញ</div>
        </div>
        
        <div class="input-group anim-2">
            <label>Student Username</label>
            <div class="input-wrap">
                <i class="fas fa-user icon"></i>
                <input type="text" id="studentName" placeholder="e.g. Dara" oninput="updateHandmadePreview()">
            </div>
        </div>

        <div class="input-group anim-3">
            <label>Plan Level</label>
            <div class="input-wrap">
                <i class="fas fa-layer-group icon"></i>
                <select id="planLevel" onchange="updateHandmadePreview()">
                    <option value="3">Standard ($3)</option>
                    <option value="6">Premium ($6)</option>
                </select>
                <i class="fas fa-chevron-down select-arrow"></i>
            </div>
        </div>

        <div class="input-group anim-4">
            <label>Secret Number</label>
            <div class="input-wrap">
                <i class="fas fa-key icon"></i>
                <input type="text" id="handmadeSecret" value="77" oninput="updateHandmadePreview()">
            </div>
        </div>

        <button onclick="activateAndCopy()" class="sn-btn anim-5" id="startBtn">
            <span class="btn-text"><i class="fas fa-bolt"></i> ACTIVATE & COPY</span>
        </button>

        <div class="result-box anim-6" id="resultBox">
            <label id="statusLabel" style="color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Status: Waiting...</label>
            <strong id="generatedCode">...</strong>
            <span id="copyMsg" class="copy-hint">Click Activate to copy</span>
        </div>
    </main>

    <script src="../assets/main.js"></script>
    <script>
        // Initialize background
        StudyNest.initBackground();

        // --- SECURITY CONFIG ---
        // SHA-256 of "kimou15062008"
        const ADMIN_HASH = "23c1a538db5b9fe80121f748954f875d5ea1b1314af33864a26aefe3e1775d20";
        const SECRET_SALT = "STUDYNEST_PRIME_2024_@#!"; // Internal salt for code generation
        // -----------------------

        async function hashString(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function updateHandmadePreview() {
            const name = document.getElementById("studentName").value.trim().toUpperCase().replace(/\s/g, "");
            const level = document.getElementById("planLevel").value;
            const secret = document.getElementById("handmadeSecret").value.trim();
            
            const codeElem = document.getElementById("generatedCode");
            const statusLabel = document.getElementById("statusLabel");

            if (!name) {
                codeElem.textContent = "...";
                statusLabel.textContent = "Status: Waiting for Name...";
                statusLabel.style.color = "var(--text-muted)";
                return;
            }

            const namePart = name.substring(0, 3);
            // New logic: first 3 of name + level + first 4 of hash(name + level + secret + salt)
            const rawString = name + level + secret + SECRET_SALT;
            const fullHash = await hashString(rawString);
            const hashPart = fullHash.substring(0, 4).toUpperCase();
            const finalCode = namePart + level + hashPart;
            
            codeElem.textContent = finalCode;
            statusLabel.textContent = "Status: Ready to Activate";
            statusLabel.style.color = "var(--primary-light)";
        }

        function activateAndCopy() {
            const name = document.getElementById("studentName").value.trim();
            const code = document.getElementById("generatedCode").textContent;
            const statusLabel = document.getElementById("statusLabel");
            const copyMsg = document.getElementById("copyMsg");
            const resultBox = document.getElementById("resultBox");

            if (!name || code === "...") {
                alert("Please enter a student name first!");
                return;
            }

            navigator.clipboard.writeText(code).then(() => {
                statusLabel.textContent = "Status: ACTIVATED & COPIED!";
                statusLabel.style.color = "var(--success)";
                copyMsg.textContent = "Code copied to clipboard!";
                copyMsg.style.color = "var(--success)";
                
                resultBox.style.borderColor = "var(--success)";
                resultBox.style.background = "rgba(116, 235, 213, 0.08)";
                
                // Reset after 3 seconds
                setTimeout(() => {
                    copyMsg.textContent = "Click Activate to copy";
                    copyMsg.style.color = "var(--text-muted)";
                    resultBox.style.borderColor = "var(--input-border)";
                    resultBox.style.background = "rgba(116, 235, 213, 0.03)";
                }, 3000);
            });
        }

        window.onload = function() {
            if (localStorage.getItem("isAdmin") === "true") {
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainPanel").style.display = "block";
                updateHandmadePreview();
            }
        }

        function adminLogout() {
            localStorage.removeItem("isAdmin");
            localStorage.removeItem("currentUserName");
            window.location.href = "../auth/login.html";
        }

        async function checkPass() {
            const pass = document.getElementById("adminPass").value;
            const inputHash = await hashString(pass);
            if (inputHash === ADMIN_HASH) {
                localStorage.setItem("isAdmin", "true");
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("mainPanel").style.display = "block";
                updateHandmadePreview();
            } else {
                alert("Wrong password!");
            }
        }
    </script>
</body>
</html>
