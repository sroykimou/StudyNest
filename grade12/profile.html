<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | StudyNest</title>
    <meta name="description" content="អ្នកពត់សិស្សក StudyNest — មើលវិកតន ត្រួចឆ័វ វឹកតនស្ពេលខ្លួន">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      :root {
        --bg: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --accent: #3b82f6;
        --border: rgba(255, 255, 255, 0.1);
        --purple: #a855f7;
      }

      body {
        background: radial-gradient(ellipse at 25% 35%, #312e81 0%, transparent 55%),
                    radial-gradient(ellipse at 75% 65%, #0f766e 0%, transparent 55%),
                    linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #134e4a 100%);
        color: white;
        font-family: "Kantumruy Pro", sans-serif;
        margin: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        min-height: 100vh;
        padding-right: 80px; /* More explicit padding */
      }

      .profile-card {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(15px);
        width: 90%;
        max-width: 450px;
        border-radius: 30px;
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        margin-left: auto; /* Forces right alignment in flex containers */
      }

      .profile-header {
        position: relative;
        height: 250px;
        background: linear-gradient(to bottom, transparent, rgba(15, 23, 42, 0.9));
      }

      #bigAvatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .header-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 40%, rgba(15, 23, 42, 1) 100%);
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-decoration: none;
        backdrop-filter: blur(5px);
        z-index: 10;
        transition: 0.3s;
        cursor: pointer;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(-3px);
      }

      .profile-info-main {
        position: absolute;
        bottom: 20px;
        left: 25px;
        z-index: 10;
      }

      .profile-info-main h2 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: var(--accent);
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 5px;
      }

      .info-body {
        padding: 30px;
      }

      .info-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
      }

      .info-icon {
        width: 45px;
        height: 45px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        font-size: 18px;
      }

      .info-content label {
        display: block;
        font-size: 11px;
        color: #64748b;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .info-content div {
        font-size: 15px;
        font-weight: 500;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 10px;
      }

      .stat-item {
        background: rgba(255, 255, 255, 0.03);
        padding: 15px;
        border-radius: 15px;
        text-align: center;
        border: 1px solid var(--border);
      }

      .stat-value {
        font-size: 20px;
        font-weight: 700;
        color: var(--accent);
        display: block;
      }

      .stat-label {
        font-size: 11px;
        color: #64748b;
      }

      .edit-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        cursor: pointer;
        z-index: 10;
        border: none;
        transition: 0.3s;
      }
      .edit-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 15px var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <div class="profile-header">
        <div onclick="goBack()" class="back-btn">
          <i class="fas fa-arrow-left"></i>
        </div>
        
        <label for="fileInput" class="edit-btn">
          <i class="fas fa-camera"></i>
        </label>
        <input type="file" id="fileInput" hidden accept="image/*" />

        <img src="" id="bigAvatar" />
        <div class="header-overlay"></div>

        <div class="profile-info-main">
          <h2 id="pName">Username</h2>
          <span class="badge" id="pLevel">Free Plan</span>
        </div>
      </div>

      <div class="info-body">
        <div class="info-row">
          <div class="info-icon"><i class="fas fa-user"></i></div>
          <div class="info-content">
            <label>Username</label>
            <div id="uHandle">@username</div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-icon"><i class="fas fa-graduation-cap"></i></div>
          <div class="info-content">
            <label>Education</label>
            <div>សិស្សថ្នាក់ទី ១២</div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-value" id="sLessons">0</span>
            <span class="stat-label">មេរៀនចប់</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="sProgress">0%</span>
            <span class="stat-label">វឌ្ឍនភាព</span>
          </div>
        </div>

        <button onclick="logout()" style="width: 100%; margin-top: 30px; padding: 15px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 15px; color: #ef4444; font-family: 'Kantumruy Pro'; font-weight: 600; cursor: pointer; transition: 0.3s;">
          <i class="fas fa-sign-out-alt"></i> ចាកចេញពីគណនី
        </button>
      </div>
    </div>

    <script>
      const user = localStorage.getItem("currentUserName") || "kimou";
      const userLevel = parseInt(localStorage.getItem("userLevel_" + user)) || 0;

      function goBack() {
        const userData = JSON.parse(localStorage.getItem("user_" + user) || "{}");
        const branch = userData.branch || "science";
        window.location.href = `${branch}/${branch}_home.html`;
      }

      window.onload = function () {
        document.getElementById("pName").textContent = user;
        document.getElementById("uHandle").textContent = "@" + user.toLowerCase().replace(/\s/g, "");
        
        // Plan Badge
        const levelBadge = document.getElementById("pLevel");
        if (userLevel >= 6) {
          levelBadge.textContent = "Premium User";
          levelBadge.style.background = "var(--purple)";
        } else if (userLevel >= 3) {
          levelBadge.textContent = "Standard User";
          levelBadge.style.background = "var(--accent)";
        }

        // Stats
        const completed = JSON.parse(localStorage.getItem("completed_lessons_" + user)) || [];
        document.getElementById("sLessons").textContent = completed.length;
        const percent = Math.min(Math.round((completed.length / 50) * 100), 100);
        document.getElementById("sProgress").textContent = percent + "%";

        // Avatar
        const savedImg = localStorage.getItem("profile_" + user);
        document.getElementById("bigAvatar").src = savedImg || `https://ui-avatars.com/api/?name=${user}&background=3b82f6&color=fff&size=512`;
      };

      document.getElementById("fileInput").onchange = function (e) {
        const reader = new FileReader();
        reader.onload = function () {
          localStorage.setItem("profile_" + user, reader.result);
          document.getElementById("bigAvatar").src = reader.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      };

      function logout() {
        localStorage.removeItem("currentUserName");
        window.location.href = "../index.html";
      }
    </script>

  </body>
</html>
