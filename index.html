<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyNest | វេទិកាសិក្សា</title>
    <meta name="description" content="StudyNest — វេទិកាសិក្សាសម្រាប់សិស្សានុសិស្សថ្នាក់ទី១២">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="assets/style.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            z-index: 10;
            position: relative;
        }
        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sn-btn {
            text-decoration: none;
            min-width: 180px;
        }
        .brand {
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .tagline {
            font-size: 1.2rem;
            opacity: 0.8;
            max-width: 500px;
            line-height: 1.6;
        }
        @media (max-width: 480px) {
            .brand {
                font-size: 3rem;
            }
            .btn-group {
                flex-direction: column;
                width: 100%;
                max-width: 250px;
            }
            .sn-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body class="bg-dark">

    <!-- Animated Background -->
    <div class="drops" id="drops"></div>
    <div class="particles" id="particles"></div>

    <main class="container anim">
        <div class="logo-wrap anim-1">
            <div class="logo-icon">
                <i class="fas fa-rocket"></i>
            </div>
        </div>

        <h1 class="brand anim-2">StudyNest</h1>
        <p class="tagline anim-3">បណ្ដុះចំណេះដឹង ដើម្បីអនាគតដ៏ភ្លឺស្វាង។ ចូលរួមជាមួយពួកយើងដើម្បីទទួលបានបទពិសោធន៍សិក្សាថ្មី!</p>

        <div class="btn-group anim-4">
            <a href="auth/login.html" class="sn-btn">
                <span class="btn-text">ចូលប្រើប្រាស់</span>
            </a>
            <a href="auth/register.html" class="sn-btn" style="background: var(--glass-bg); border: 1px solid var(--glass-border);">
                <span class="btn-text">ចុះឈ្មោះ</span>
            </a>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="assets/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // បើកដំណើរការ Background Animations
            if (typeof StudyNest !== 'undefined') {
                StudyNest.initBackground();
            }
            
            // ប្រសិនបើ Login រួចហើយ អាចបញ្ជូនទៅ Dashboard តែម្តង (Optional)
            /*
            if (StudyNest.getUser()) {
                const user = StudyNest.getUser();
                let branch = "science";
                let grade = "12";
                try {
                    const userData = JSON.parse(localStorage.getItem("user_" + user) || "{}");
                    if (userData.branch) branch = userData.branch;
                    if (userData.grade) grade = userData.grade;
                } catch (e) {}
                window.location.href = `grade${grade}/${branch}/${branch}_home.html`;
            }
            */
        });
    </script>
</body>
</html>
